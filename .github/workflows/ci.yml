name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t portfolio-smoke .
      - name: Start container and verify HTTP assets
        run: |
          docker run -d --name smoke -p 8000:8000 -e SEC_USER_AGENT="FormScope CI smoke test, no SEC data requests" portfolio-smoke
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then ready=true; break; fi
            sleep 5
          done
          if [ "$ready" != true ]; then docker logs smoke; exit 1; fi
          curl --fail --silent http://127.0.0.1:8000/ > /tmp/index.html
          curl --fail --silent http://127.0.0.1:8000/app.js > /tmp/app.js
          curl --fail --silent http://127.0.0.1:8000/sample.json > /tmp/sample.json
      - name: Container logs
        if: always()
        run: docker logs smoke || true
